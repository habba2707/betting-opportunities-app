services:
  - type: web
    name: betting-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: THE_ODDS_API_KEY
        sync: false  # Set this manually in Render dashboard
      - key: DB_HOST
        fromDatabase:
          name: betting-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: betting-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: betting-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: betting-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: betting-db
          property: password

  - type: web
    name: betting-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://betting-backend.onrender.com  # Update after backend deploys

databases:
  - name: betting-db
    plan: free
    postgresVersion: "16"
